version: '3.8'

services:
  lounge-pos:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: 716qx_lounge_os
    restart: unless-stopped
    ports:
      - "7160:7160"
    environment:
      - NODE_ENV=production
      - PORT=7160
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7160/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true
